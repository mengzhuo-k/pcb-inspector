<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>焊视 · 图片标注</title>
<link rel="stylesheet" href="./static/platform.css?v=20261111aq">
</head><body>
<header class="topbar"><div class="brand"><span class="mark">▦</span><span>焊视</span></div></header>
<main>
  <section class="model-update-bar" aria-label="模型更新">
    <span id="latestModelLabel" role="status">正在读取最新模型…</span>
    <a class="recognition-entry" href="/static/index.html">进入识别系统</a>
  </section>
  <p id="modelTestNotice" role="alert" hidden></p>
  <h1 class="workspace-title">拍照上传与缺陷标注</h1>
  <details id="uploadPanel" class="panel upload-panel" open>
    <summary>拍照 / 上传</summary>
      <form id="uploadForm" class="grid3">
        <label class="wide">图片文件<input id="uploadFiles" name="files" type="file" accept="image/*" multiple="" required=""></label>
        <button class="primary">上传并入库</button><button id="openCamera" type="button" class="quiet">拍照上传</button>
      </form>
  </details>
    <div id="annotationWorkspace" class="label-layout">
      <aside class="image-browser">
        <div class="panelhead"><h2>图片</h2><span id="labelStats" class="muted">0 张图片</span></div>
      <div class="filters">
        <button data-img-filter="all" class="active">全部</button>
        <button data-img-filter="new">未处理</button>
        <button data-img-filter="approved">已处理</button>
      </div>
        <div class="image-list" id="labelList"></div>
      </aside>
      <article id="annotationEditor" class="editor">
        <div class="editor-toolbar">
          <label>标注人<input id="annotator" maxlength="80" placeholder="姓名"></label>
          <button id="prevImage" class="quiet" disabled="">← 上一张</button>
          <button id="nextImage" class="quiet" disabled="">下一张 →</button>
          <span id="imageProgress" class="progress-pill">1 / 1</span>
          <button id="deleteTrainingImage" class="danger">删除</button>
          <button id="saveLabels" class="primary">保存</button>
        </div>
        <p id="editorEmpty" class="empty">选择或上传图片开始标注。</p>
        <p id="readOnlyHint" class="muted" hidden>已处理 · 可悬停查看缺陷名称</p>
        <p id="alignmentHint" class="muted" role="status" hidden></p>
        <button id="setReference" class="quiet" hidden>将当前图片设为对齐标准图</button>
        <button id="manualAlign" class="quiet" hidden>手动四点对齐</button>
        <div class="site-tools">
          <button id="detectSites" class="quiet">自动定位焊点 / 焊脚</button>
          <button id="editSites" class="quiet">补点 / 删点</button>
          <button id="saveSites" class="quiet" disabled>保存点位模板</button>
          <label class="inline-check"><input id="showSites" type="checkbox" checked>显示点位</label>
          <button id="batchSiteDefect" class="quiet" disabled>选择缺陷类型</button>
          <button id="clearSiteSelection" class="quiet" disabled>清空选择</button>
          <span id="siteStatus" class="muted" role="status">尚未建立点位模板</span>
        </div>
        <p id="siteHint" class="muted">点击或拖框多选点位，再点击“选择缺陷类型”。右键清空选择。</p>
        <div class="annotation-workspace" hidden>
          <aside class="board-overview">
            <h2>整板定位</h2>
            <canvas id="overviewCanvas" width="300" height="320" aria-label="整板定位，点击放大对应位置"></canvas>
            <p>点击位置放大查看。蓝框表示右侧查看范围。</p>
            <input id="siteSearch" aria-label="搜索点位编号" placeholder="搜索点位编号" maxlength="80">
            <div id="siteList" class="candidate-list"></div>
          </aside>
          <div class="detail-workspace">
            <div class="detail-tools">
              <strong>焊点 / 焊脚细节</strong>
              <button id="zoomOut" aria-label="缩小">−</button><span id="zoomValue">1×</span><button id="zoomIn" aria-label="放大">+</button>
              <button id="resetZoom" class="quiet">看全图</button>
              <label>亮度<input id="detailBrightness" type="range" min="70" max="150" value="100"></label>
              <button id="resetDisplay" class="quiet">重置显示</button>
            </div>
            <div class="canvas-wrap">
              <canvas id="labelCanvas" width="600" height="450" tabindex="0"></canvas>
              <div id="hoverInfo" class="hover-info" hidden></div>
              <div id="siteDefectPopup" class="class-popup" role="dialog" aria-label="缺陷类型" hidden></div>
            </div>
          </div>
        </div>
      </article>
    </div>

</main>
<dialog id="alignmentDialog" class="help-dialog">
  <div class="help-head"><h2>手动对齐板面</h2><button id="cancelAlignment" type="button">关闭</button></div>
  <div class="help-body"><p id="pointInstruction" role="status"></p>
    <canvas id="pointCanvas" aria-label="依次选择板面对应位置"></canvas>
    <button id="undoPoint" type="button">撤销上一点</button>
    <button id="applyAlignment" class="primary" type="button">完成对齐</button>
  </div>
</dialog>
<dialog id="cameraDialog" class="help-dialog">
  <div class="help-head"><h2>拍照上传</h2><button id="closeCamera" type="button" class="quiet">关闭</button></div>
  <div class="help-body">
    <video id="captureVideo" autoplay playsinline muted></video>
    <p id="cameraStatus" role="status"></p>
    <button id="takePhoto" type="button" class="primary" disabled>拍照并上传</button>
  </div>
</dialog>
<div id="toast" role="status"></div>
<script src="./static/model-test-notice.js"></script>
<script src="./static/platform.js?v=20261111aq"></script>
</body></html>
